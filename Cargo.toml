[workspace]
resolver = "2"
members = ["crates/verity-core", "crates/verity"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/uncoalesced/Verity"
authors = ["uncoalesced"]
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-str"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
