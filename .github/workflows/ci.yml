# This is what turns "the tests pass on my machine" into evidence. The
# evaluations run here too, because a control library is exactly the kind of
# thing that keeps passing its unit tests while quietly getting worse at its job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Tests
        run: uv run python -m pytest -q

      # The evaluations below are deterministic and need no model, no API key
      # and no database, so they belong in every run rather than in a nightly
      # job somebody stops reading. Anything needing Claude (the citation check,
      # RAGAS) or real inference (the extraction eval, the end-to-end image
      # path) is deliberately not here -- see the README for how to run those.
      - name: Control precision and recall (19 hand-written cases)
        run: uv run -m verity.eval.policy_eval --out policy_eval_report.json

      - name: Control precision and recall (held-out fraud set)
        run: >
          uv run -m verity.eval.fraud_eval
          --corpus sample/verity_sample_invoices_m_500.csv
          --out fraud_eval_report.json

      - name: Trajectory success rate
        run: uv run -m verity.eval.trajectory_eval --work-dir "${{ runner.temp }}/pages"

      - name: Policy retrieval quality
        run: >
          uv run -m verity.eval.rag_eval
          --corpus sample/verity_sample_invoices_m_500.csv
          --out rag_eval_report.json

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            policy_eval_report.json
            fraud_eval_report.json
            rag_eval_report.json
            trajectory_eval_report.json
          if-no-files-found: warn

  # The Rust core is the verdict engine from v1.1 on. It is held to the Python
  # engine finding-for-finding (parity), and the binary is exercised end to end:
  # fixtures, the MCP protocol, and the injection / XSS / auth defences.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: The core crate has no network code
        run: "! cargo tree -p verity-core -e normal | grep -E 'reqwest|hyper|ureq|curl|tokio'"
      - name: Dependency advisories
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - name: Build
        run: cargo build --release --locked
      - name: Snapshot integrity (offline)
        run: target/release/verity verify data/snapshot/MANIFEST.json
      - name: Rust/Python parity, including every real row
        run: uv run python scripts/parity.py data/snapshot/uk_dcms.json data/snapshot/usaspending.json
      - name: Smoke (fixtures, MCP, security, versions)
        run: uv run python scripts/smoke.py all
      - name: Benchmark numbers still reproduce
        run: uv run python scripts/bench.py --check
