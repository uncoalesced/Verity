[project]
name = "verity"
version = "0.1.0"
description = "Agentic multimodal document-compliance auditor (Month 1: ingestion + extraction + eval)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "pypdf>=5.0",
    "transformers>=4.44",
    "torch>=2.2",
    "torchvision>=0.17",  # transformers image processors (YOLOS) require it
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "datasets>=2.20",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
